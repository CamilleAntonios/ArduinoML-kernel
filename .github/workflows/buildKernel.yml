name: Build Kernel JVM

on:
  pull_request:
    branches:
      - master
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build kernel-jvm module
        working-directory: kernels/jvm
        run: mvn clean install -B
